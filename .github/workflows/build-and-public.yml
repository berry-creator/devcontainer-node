name: Build devcontainer image and publish to DockerHub

on:
  push:
    tags:
      - '*'

env:
  DOCKERHUB_REPO: letsdone/devcontainer-node
  NODEJS_VERSION: 24.17.0

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            suffix: ""
            latest: false
            extras: |


          - name: claude
            suffix: "-claude"
            latest: false
            extras: |
              CLAUDE_PREINSTALLED=true

          - name: gemini
            suffix: "-gemini"
            latest: false
            extras: |
              GEMINI_PREINSTALLED=true

          - name: codex
            suffix: "-codex"
            latest: false
            extras: |
              CODEX_PREINSTALLED=true

          - name: claude-gemini
            suffix: "-claude-gemini"
            latest: false
            extras: |
              CLAUDE_PREINSTALLED=true
              GEMINI_PREINSTALLED=true

          - name: all
            suffix: "-all"
            latest: true
            extras: |
              CLAUDE_PREINSTALLED=true
              GEMINI_PREINSTALLED=true
              CODEX_PREINSTALLED=true

    steps:
      - uses: actions/checkout@v5

      - name: Generate App Version
        run: echo "APP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        run: |
          TAGS="${DOCKERHUB_REPO}:${APP_VERSION}${{ matrix.suffix }}"
          if [ "${{ matrix.latest }}" = "true" ]; then
            TAGS="$TAGS,${DOCKERHUB_REPO}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            NODEJS_VERSION=${{ env.NODEJS_VERSION }}
            ${{ matrix.extras }}
